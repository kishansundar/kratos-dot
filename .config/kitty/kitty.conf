# kitty: Swiss desktop type and spacing. Colours are in light-theme.auto.conf and dark-theme.auto.conf
# (links into ~/.config/swiss-desktop/build); kitty switches between them by itself when the system colour scheme changes.

# Geist Mono, the shell's own monospace (the owner's choice of one type system, 16 October 2026; JetBrains Mono Nerd
# Font until then). Geist Mono has no icon glyphs: the private-use planes where Nerd Fonts keep them (yazi, lazygit,
# the prompt) come from Symbols Nerd Font Mono.
font_family      Geist Mono
symbol_map       U+E000-U+F8FF,U+F0000-U+FFFFD Symbols Nerd Font Mono
font_size        11.0
# A little more line spacing than the font's own, for reading.
modify_font      cell_height 110%
# Text weight: kitty's Linux default draws dark text on a light background thin and grey; its macOS values (gamma
# 1.7, contrast 30 %) set it in proper ink. Light text on dark gets a little firmer too. (One value for both modes:
# kitty takes only colours from the light/dark theme files.)
text_composition_strategy 1.7 30
# Faint text (SGR 2: Claude Code's and many tools' secondary lines): kitty blends it into the background in linear
# light, so its default 0.4 left faint ink on paper at 1.6:1. At 0.7 it reads 2.9:1 on paper (APCA Lc 53) and still
# sits 12 L* below the normal text on graphite. (One value for both modes, like the line above. Kitty audit, 18 October 2026.)
dim_opacity 0.7

# 12 pt = 16 px: the grid margin.
window_padding_width 12

# A solid block cursor that does not blink (no wakeups while idle).
cursor_shape          block
cursor_blink_interval 0

# Flat tabs: the current one on the surface2 grey in bold italic (kitty's default active-tab style), the others quiet.
tab_bar_style      separator
tab_separator      "  "
tab_title_template " {index} {title} "

hide_window_decorations yes
enable_audio_bell       no

# A little see-through in both modes: the background lets the frosted wallpaper through (mango blurs it); the
# text stays solid. 94 %, the owner's choice after the kitty audit (18 October 2026; it was 80 %): at 80 % the
# posters' headlines showed through, paper turned grey or pink over black and red, and quiet grey text fell to
# 3.0-3.3:1; at 94 % it stays at 4.5:1 or more and the wallpaper is a hint. (kitty applies a change here only to new
# windows: dynamic_background_opacity is off.) mango draws kitty solid when unfocused too (rule.conf).
background_opacity 0.94

# The bar's busy mark (the owner's busy-indicator package, 16 October 2026): tells the shell when a command starts and
# ends, which window has the focus, and when one closes (the file is a link into ~/.config/quickshell/scripts). kitty
# attaches it to windows it opens from now on.
watcher busy_watcher.py
