# Lock screen in the shell's language, on its 8 px grid with a 48 px page margin (s7): the bar's ruled clock at 128 px
# (lock-clock.sh: Geist Bold, the red stroke as tall as the figures, the same space either side of it), a Geist Mono
# annotation line, the ruler's start, a square password field, the NixOS mark at the foot. Colours and wallpaper
# follow Light or Dark Mode through the link swiss-mode switches. Sizes in hyprlock are points: 96 pt = 128 px,
# 10 pt = 13 px (the shell's mono). Positions are from the top left, y downwards as negative numbers.
source = ~/.config/swiss-desktop/build/current/hyprlock-colors.conf

general {
    # the pointer shows, for the now-playing square (a click plays or pauses)
    hide_cursor = false
    ignore_empty_input = true
}

# The wallpaper blurred: the posters set their headline in the top left, under the clock, so their words go soft and
# the lock's own text reads clear over them.
background {
    monitor =
    path = $wallpaper
    color = $background
    blur_passes = 3
    blur_size = 14
    brightness = 0.85
    noise = 0
}

# The clock: its figures' tops on y = 48, the first figure's ink on the margin (the label starts 8 px before it).
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/lock-clock.sh $accent_hex
    color = $text
    font_family = Geist
    font_size = 96
    position = 40, -10
    halign = left
    valign = top
}

# Annotation: week, day and date, in lower case.
label {
    monitor =
    text = cmd[update:60000] date '+w%V  ·  %A %-d %B %Y' | tr 'A-Z' 'a-z'
    color = $text2
    font_family = Geist Mono
    font_size = 10
    position = 48, -168
    halign = left
    valign = top
}

# The ruler's start: a 1 px baseline 384 px long (the field's width), an 8 px origin tick and four 4 px ticks every
# 8 px (each tick's height includes the baseline's row, as in the shell's Ruler).
shape {
    monitor =
    size = 384, 1
    color = $border_strong
    rounding = 0
    border_size = 0
    position = 48, -200
    halign = left
    valign = top
}
shape {
    monitor =
    size = 1, 7
    color = $border_strong
    rounding = 0
    border_size = 0
    position = 48, -193
    halign = left
    valign = top
}
shape {
    monitor =
    size = 1, 3
    color = $border_strong
    rounding = 0
    border_size = 0
    position = 56, -197
    halign = left
    valign = top
}
shape {
    monitor =
    size = 1, 3
    color = $border_strong
    rounding = 0
    border_size = 0
    position = 64, -197
    halign = left
    valign = top
}
shape {
    monitor =
    size = 1, 3
    color = $border_strong
    rounding = 0
    border_size = 0
    position = 72, -197
    halign = left
    valign = top
}
shape {
    monitor =
    size = 1, 3
    color = $border_strong
    rounding = 0
    border_size = 0
    position = 80, -197
    halign = left
    valign = top
}

# Password: square, a 1 px rule, 384 x 48 outside (hyprlock draws the rule outside the size, so the size is 382 x 46
# and the position is 1 px in); red while checking and on a failure (with PAM's words); amber while caps
# lock is on (the line under the field says so in words). Enter unlocks.
input-field {
    monitor =
    size = 382, 46
    outline_thickness = 1
    rounding = 0
    outer_color = $border_strong
    inner_color = $surface
    font_color = $text
    font_family = Geist
    check_color = $accent_fill
    fail_color = $accent
    fail_text = $PAMFAIL
    capslock_color = $warning
    placeholder_text = password
    dots_rounding = -2
    dots_size = 0.2
    dots_spacing = 0.45
    dots_center = false
    fade_on_empty = false
    position = 49, -217
    halign = left
    valign = top
}

# Caps lock, in words with the attention mark (an ink triangle), only while it is on: any keyboard's caps lock light.
label {
    monitor =
    text = cmd[update:500] grep -qs 1 /sys/class/leds/input*::capslock/brightness && echo '▲  caps lock is on'
    color = $text
    font_family = Geist Mono
    font_size = 10
    position = 48, -280
    halign = left
    valign = top
}

# Now playing, only while something plays (lock-media.sh, from the shell's player: the one the bar shows and the
# media keys drive). The Now Playing panel's one red square, 48 px like the field, 24 px under the caps-lock line's
# place: a click plays or pauses (the Play/Pause key still does too); the title beside it, and under it the artist and
# the app as an annotation. Paused here it stays, so it can be resumed.
image {
    monitor =
    path = /home/kishan/.config/hypr/lock-media/none.png
    reload_time = 1
    reload_cmd = ~/.config/hypr/lock-media.sh button
    onclick = ~/.config/hypr/lock-media.sh toggle
    size = 48
    rounding = 0
    border_size = 0
    position = 48, -320
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/lock-media.sh title
    color = $text
    font_family = Geist
    font_size = 12
    position = 112, -321
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/lock-media.sh meta
    color = $text2
    font_family = Geist Mono
    font_size = 10
    position = 112, -349
    halign = left
    valign = top
}

# The mark at the foot of the page, alone (no name: the hostname may change), on the margin.
image {
    monitor =
    path = $logo
    size = 32
    rounding = 0
    border_size = 0
    position = 48, 48
    halign = left
    valign = bottom
}
