general {
    # Super+Shift+L and the 5-minute step both send loginctl lock-session; this starts the lock screen for it.
    # One lock screen per display: lock.sh holds a lock file while hyprlock runs (pidof hyprlock matched any display's,
    # a test rig's too). No $ variables here: hypridle substitutes them itself and can break the path.
    lock_cmd = ~/.config/hypr/lock.sh start
}

# Screensaver after 4 minutes without input: the matrix rain (screensaver.sh); any input ends it. Unless the rain
# is stopped, the lock follows a minute later and covers it.
listener {
    timeout = 240
    on-timeout = ~/.config/hypr/screensaver.sh start
    on-resume = ~/.config/hypr/screensaver.sh stop
}

# Lock after 5 minutes without input.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off 10 seconds after that lock, back on at the first input.
listener {
    timeout = 310
    on-timeout = ~/.config/hypr/screens.sh off
    on-resume = ~/.config/hypr/screens.sh on
}

# While locked (at login or by Super+Shift+L), screen off after 60 seconds without input.
listener {
    timeout = 60
    on-timeout = ~/.config/hypr/lock.sh locked && ~/.config/hypr/screens.sh off
    on-resume = ~/.config/hypr/screens.sh on
}
