# Swiss desktop (@mode@): lock screen colours, read by ~/.config/hypr/hyprlock.conf. Generated by swiss-build.
$background = rgb(@background@)
$surface = rgb(@surface@)
$text = rgb(@text@)
$text2 = rgb(@text2@)
$muted = rgb(@muted@)
$border_strong = rgb(@border_strong@)
$accent = rgb(@accent@)
$accent_fill = rgb(@accent_fill@)
# The red as bare hex, for Pango markup (the clock's stroke, ~/.config/hypr/lock-clock.sh).
$accent_hex = @accent_fill@
$warning = rgb(@warning@)
$surface2 = rgb(@surface2@)
$border = rgb(@border@)
$wallpaper = @home@/@wallpaper@
$logo = @home@/.config/swiss-desktop/build/@mode@/logo.png
