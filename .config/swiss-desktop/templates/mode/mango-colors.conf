# Swiss desktop (@mode@): window colours for mango. Generated by swiss-build from tokens/@mode@.env; do not edit here.
# A 1 px frame: the focused window's in ink (the text colour), the others in the hairline colour. Red stays for marks
# in the shell ("now / here"), not window frames.
root_color=0x@background@ff
border_color=0x@border@ff
focus_color=0x@text@ff
maximized_screen_color=0x@text2@ff
urgent_color=0x@warning@ff
scratchpad_color=0x@info@ff
global_color=0x@info@ff
overlay_color=0x@info@ff
split_color=0x@accent_fill@ff
drop_color=0x@accent_fill@55
# Monocle's tab strip (two or more windows on a monocle tag) and Alt+Tab's jump labels, which mango draws itself: a 1 px
# hairline and square corners like every rule in the shell, Geist as in the bar. The focused tab is filled with ink
# (filled = selected); every jump label is an ink key on the ground (mango 0.18 never draws its "focus" label colours).
tab_bar_height=32
tab_bar_decorate_bg_color=0x@background@ff
tab_bar_decorate_fg_color=0x@text2@ff
tab_bar_decorate_focus_bg_color=0x@text@ff
tab_bar_decorate_focus_fg_color=0x@background@ff
tab_bar_decorate_border_color=0x@border@ff
tab_bar_decorate_border_width=1
tab_bar_decorate_corner_radius=0
tab_bar_decorate_padding_x=16
tab_bar_decorate_padding_y=0
tab_bar_decorate_font_desc=Geist Medium 9
jump_label_decorate_bg_color=0x@background@ff
jump_label_decorate_fg_color=0x@text@ff
jump_label_decorate_border_color=0x@text@ff
jump_label_decorate_border_width=1
jump_label_decorate_corner_radius=0
jump_label_decorate_padding_x=10
jump_label_decorate_padding_y=6
jump_label_decorate_font_desc=Geist Mono Bold 12
