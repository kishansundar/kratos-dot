# lazygit (~/.config/lazygit/config.yml links here): the Swiss selection ground for the selected line, the same as
# kitty's mouse selection and fish's search match. lazygit asks the terminal for its background and uses lightTheme or
# darkTheme; its own dark default was the terminal's blue under near-white text (2.2:1, kitty audit 18 October 2026).
# Generated by swiss-build from tokens/{light,dark}.env; do not edit here.
gui:
  darkTheme:
    selectedLineBgColor:
      - "#@dark.selection@"
  lightTheme:
    selectedLineBgColor:
      - "#@light.selection@"
