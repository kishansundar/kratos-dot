### MangoHud: the everyday in-game overlay, for games started with `mangohud %command%` in Steam's launch options.
### (The Wukong benchmark uses its own small HUD: ~/gaming-bench/tools/bench.conf.)
### Rows appear in the order written here (legacy_layout=0); the custom_text lines are the section headings.
###
### Keys:  Right Shift+F12  hide / show        Right Shift+F10  cycle views (this one, off, FPS only, bar, extended, full)
###        Right Shift+F9   restart the AVG / 1% / 0.1% counters (e.g. after a loading screen)
###        Right Shift+F11  move to another corner    Left Shift+F2  start / stop a frame-time log (logs/manual)
legacy_layout=0

### Look
position=top-left
font_size=22
text_outline
background_alpha=0.45
round_corners=8
table_columns=3

### FRAMES: how smooth it is
custom_text=FRAMES
time
fps
frametime
fps_color_change
fps_value=60,120
### AVG = average since start (or the last Right Shift+F9); 1% / 0.1% = the frame rate of the slowest 1 % / 0.1 % of
### frames, the stutter you feel. A big gap between AVG and 1% means uneven frames.
fps_metrics=avg,0.01,0.001
frame_timing

### GPU: GTX 1070. Load near 99 % means the graphics card is the limit; lower settings to gain FPS.
custom_text=GRAPHICS CARD
gpu_text=GPU
gpu_stats
gpu_temp
gpu_fan
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_power_limit
vram

### CPU: i7-8700K. Overall load stays low even when the CPU is the limit: watch the per-thread bars; one bar pinned at
### the top while the GPU sits well below 99 % means one game thread is holding the frame rate back.
custom_text=PROCESSOR
cpu_text=CPU
cpu_stats
cpu_temp
cpu_mhz
core_load
core_bars
ram
swap
procmem
io_read
io_write

### SOFTWARE: what the game runs on
custom_text=SOFTWARE
wine
winesync
engine_version
present_mode
resolution
gamemode

### Logging (only when Left Shift+F2 is pressed; logs stay on this machine)
toggle_logging=Shift_L+F2
output_folder=/home/kishan/gaming-bench/logs/manual
