    <button class="hit btn">Default</button>
    <button class="hit btn is-hover">Hover</button>
    <button class="hit btn is-pressed">Pressed</button>
    <button class="hit btn is-focus">Focus</button>
    <button class="hit btn" disabled>Disabled</button>

  <div style="display:flex;gap:var(--s2)">
    <button class="hit btn primary">Connect</button>
    <button class="hit btn text">Dismiss</button>

  </div>
</div>
