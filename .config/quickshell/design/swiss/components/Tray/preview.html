<!-- @dsCard group="Bar" height=320 subtitle="Tray drawer: icons slide out inside the bar; click the chevron" -->
<div class="stage flush">
<div class="bar label" style="justify-content:flex-end"><div class="mod"><div class="tray "><div class="items"><button class="hit" title="syncthing"><span class="ic">&#xE020;</span></button><button class="hit" title="steam"><span class="ic">&#xE025;</span></button><button class="hit" title="discord"><span class="ic">&#xE024;</span></button><button class="hit" title="nextcloud"><span class="ic">&#xE026;</span></button></div><div class="pinned"><button class="hit" title="network manager"><span class="ic">&#xE009;</span></button></div><button class="hit toggle" aria-label="show tray" aria-expanded="false"><span class="ic">&#xE01C;</span></button><span class="extent"></span></div></div></div><div class="label faint" style="padding:var(--s2) var(--barPadX) var(--s4)">Collapsed: one pinned item and the chevron. Nothing else takes space.</div>
<div class="bar label" style="justify-content:flex-end"><div class="mod"><div class="tray "><div class="items"><button class="hit" title="syncthing"><span class="ic">&#xE020;</span></button><button class="hit" title="steam"><span class="ic">&#xE025;</span></button><button class="hit" title="discord"><span class="ic">&#xE024;</span></button><button class="hit" title="nextcloud"><span class="ic">&#xE026;</span></button></div><div class="pinned"><button class="hit" title="network manager"><span class="ic">&#xE009;</span></button></div><button class="hit toggle" aria-label="show tray" aria-expanded="false"><span class="ic">&#xE01C;</span><b class="tri"></b></button><span class="extent"></span></div></div></div><div class="label faint" style="padding:var(--s2) var(--barPadX) var(--s4)">An item needs attention: an ink triangle on the chevron; the tooltip names it.</div>
<div class="bar label" style="justify-content:flex-end"><div class="mod"><div class="tray open"><div class="items"><button class="hit" title="syncthing"><span class="ic">&#xE020;</span></button><button class="hit" title="steam"><span class="ic">&#xE025;</span></button><button class="hit" title="discord"><span class="ic">&#xE024;</span></button><button class="hit" title="nextcloud"><span class="ic">&#xE026;</span></button></div><div class="pinned"><button class="hit" title="network manager"><span class="ic">&#xE009;</span></button></div><button class="hit toggle" aria-label="hide tray" aria-expanded="true"><span class="ic">&#xE01D;</span></button><span class="extent"></span></div></div></div><div class="label faint" style="padding:var(--s2) var(--barPadX) var(--s4)">Open: items slide out to the left of the chevron, the drawer’s extent marked on the bar rule. Click the chevron again to close.</div>
</div>
<script>document.querySelectorAll('.tray .toggle').forEach(b=>b.addEventListener('click',()=>{const t=b.closest('.tray');t.classList.toggle('open');b.setAttribute('aria-expanded',t.classList.contains('open'))}));</script>
