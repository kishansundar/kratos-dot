<!-- @dsCard height=288 -->
<style>
  .cv { position: relative; width: 960px; height: 288px; background: var(--bg); overflow: hidden; }
  .crow { position: absolute; right: var(--s5); top: var(--s7); display: flex; gap: var(--s6); align-items: center; }
  .crow .ic { font-size: 64px; line-height: 64px; height: 64px; }
  .rule { position: absolute; left: 0; right: 0; top: calc(var(--s7) + 64px + var(--s4)); height: 1px; background: var(--tick); }
  .tb { position: absolute; left: var(--s5); bottom: var(--s5); max-width: 460px; }
  .nm { font-family: var(--font-display); font-weight: 700; font-size: 96px; line-height: 0.95; letter-spacing: -0.02em; color: var(--text); margin: 0; }
  .tg { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--textMuted); margin: var(--s2) 0 0; }
</style>
<div class="cv">
  <div class="crow"><span class="ic">&#xE01C;</span><span class="ic" style="color:var(--accent)">&#xE032;</span><span class="ic">&#xE033;</span><span class="ic">&#xE00A;</span></div>
  <div class="rule"></div>
  <div class="tb"><p class="nm">Tray row</p><p class="tg">The chevron, the Claude item and keep-awake, made to match the bar's glyphs.</p></div>
</div>
