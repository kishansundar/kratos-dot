<!-- @dsCard height=288 -->
<style>
  .cv { position: relative; width: 960px; height: 288px; background: var(--bg); overflow: hidden; }
  .qq { position: absolute; left: 480px; right: var(--s5); top: var(--s7); font-family: var(--font-display); font-weight: 700; font-size: 64px; line-height: 64px; color: var(--text); letter-spacing: -0.02em; }
  .qq .u { text-decoration: underline; text-decoration-thickness: 6px; text-underline-offset: 10px; }
  .ru { position: absolute; left: 480px; right: var(--s5); top: 152px; height: 16px;
    background: linear-gradient(var(--tick), var(--tick)) left bottom / 100% 1px no-repeat,
      linear-gradient(var(--tick), var(--tick)) left bottom / 1px 16px no-repeat,
      linear-gradient(var(--tick), var(--tick)) right bottom / 1px 16px no-repeat,
      repeating-linear-gradient(to right, var(--tick) 0 1px, transparent 1px 16px) left bottom / 100% 8px no-repeat; }
  .ru i { position: absolute; left: 0; bottom: -2px; width: 7%; height: 6px; background: var(--accent); }
  .tb { position: absolute; left: var(--s5); bottom: var(--s5); max-width: 420px; }
  .nm { font-family: var(--font-display); font-weight: 700; font-size: 96px; line-height: 0.95; letter-spacing: -0.02em; color: var(--text); margin: 0; }
  .tg { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--textMuted); margin: var(--s2) 0 0; }
</style>
<div class="cv">
  <div class="qq"><span class="u">F</span>iles</div>
  <div class="ru"><i></i></div>
  <div class="tb"><p class="nm">Launcher</p><p class="tg">Only real matches, best first; the query on a ruler that shows how much still matches.</p></div>
</div>
