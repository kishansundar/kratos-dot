<!-- @dsCard height=288 -->
<style>
  .cv { position: relative; width: 960px; height: 288px; background: var(--bg); overflow: hidden; }
  .dk { position: absolute; right: var(--s5); bottom: 0; display: flex; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; padding: 0 8px; }
  .dk > span { width: 64px; height: 80px; display: flex; flex-direction: column; align-items: center; padding-top: 12px; position: relative; }
  .dk i { display: block; width: 48px; height: 48px; border-radius: 10px; }
  .dk b { display: block; width: 16px; height: 2px; background: var(--text); margin-top: 8px; }
  .dk .sep { width: 1px; height: 32px; background: var(--line); margin: 24px 8px 0; padding: 0; }
  .nx { position: relative; width: 48px; height: 48px; }
  .nx .ic { position: absolute; left: 0; top: 0; font-size: 48px; line-height: 48px; height: 48px; }
  .tb { position: absolute; left: var(--s5); bottom: var(--s5); max-width: 360px; }
  .nm { font-family: var(--font-display); font-weight: 700; font-size: 96px; line-height: 0.95; letter-spacing: -0.02em; color: var(--text); margin: 0; }
  .tg { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--textMuted); margin: var(--s2) 0 0; }
</style>
<div class="cv">
  <!-- placeholder tiles stand in for real app icons -->
  <div class="dk">
    <span><span class="nx"><span class="ic" style="color:var(--text)">&#xE035;</span><span class="ic" style="color:var(--accent)">&#xE034;</span></span></span>
    <span class="sep"></span>
    <span><i style="background:#2b2b2b"></i><b></b></span>
    <span><i style="background:#3b6fd8"></i><b></b></span>
    <span><i style="background:#e0a030"></i></span>
    <span><i style="background:#2f9e6a"></i><b></b></span>
    <span><i style="background:#d65a5a"></i><b></b></span>
  </div>
  <div class="tb"><p class="nm">Dock</p><p class="tg">Only on an empty desktop. The apps' own icons on quiet ink chrome, hung from the bottom edge.</p></div>
</div>
