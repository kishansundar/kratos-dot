<!-- @dsCard group="Control centre" height=272 subtitle="Quick-toggle tiles, 2 of 6 columns each" -->
<div class="stage" style="width:var(--popupWidth)">
  <div class="tiles" style="width:100%">
    <button class="hit tile on"><span class="ic panel">&#xE00A;</span><span class="ci state"></span><span class="label">Wi-Fi<br><span class="muted">Home-5G</span></span></button>
    <button class="hit tile"><span class="ic panel">&#xE00E;</span><span class="ci off state"></span><span class="label">Bluetooth<br><span class="muted">Off</span></span></button>
    <button class="hit tile"><span class="ic panel">&#xE012;</span><span class="ci off state"></span><span class="label">DND<br><span class="muted">Off</span></span></button>
    <button class="hit tile on"><span class="ic panel">&#xE013;</span><span class="ci state"></span><span class="label">Theme<br><span class="muted caps">Dark</span></span></button>
  </div>
</div>
