<!-- @dsCard height=288 -->
<style>
  .cv { position: relative; width: 960px; height: 288px; background: var(--bg); overflow: hidden; }
  .cv svg { position: absolute; left: 0; top: 0; }
  .ink { fill: var(--text); } .acc { fill: var(--accent); } .alt { fill: var(--surfaceAlt); } .tk rect { fill: var(--tick); }
  .tb { position: absolute; left: var(--s5); bottom: var(--s5); max-width: 440px; }
  .nm { font-family: var(--font-display); font-weight: 700; font-size: 96px; line-height: 0.95; letter-spacing: -0.02em; color: var(--text); margin: 0; }
  .tg { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--textMuted); margin: var(--s2) 0 0; }
</style>
<div class="cv">

    blocks: ink art square 192×192 bleeding top, accent square 96×96 in its corner (the art motif), surfaceAlt 96×96 relief, accent playButton-scale square 48×48 — radius 0

    pattern: the seek ruler — tick baseline, ticks every 24 (3×s2), majors every s7, a 3px ink fill to 62 % ending in a 2×16 value tick
    scales: module s7 48, rulerFill 3, tickValue 16, tickMinor 4 / tickMajor 8, radius 0
  -->
