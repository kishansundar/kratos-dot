# layer rule
layer_rule=no_blur:1,layer_name:^selection$

# window rule: a clicked notification may focus its app's window, for the browsers only (any other app that asks for
# focus without a valid activation token is marked urgent instead of taking the keyboard)
window_rule=activation_bypass:1,app_id:^(zen|helium)$

# window rule: VRR (G-Sync) is on only while a full-screen window has the focus
window_rule=vrr_only_fullscreen:1,app_id:.*

# window rule: the browsers are drawn solid, not see-through
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^(zen|helium)$

# window rule: terminals too, when unfocused (the owner's choice, kitty audit 18 October 2026): at 82 % the wallpaper's
# headline showed through the text of every other terminal and quiet grey text fell to 2.9-3.2:1. kitty keeps its own
# 94 % background, so terminals stay faintly frosted; focus is shown by the border
window_rule=focused_opacity:1.0,unfocused_opacity:1.0,app_id:^kitty$

# window rule: the screensaver fills the screen and is drawn solid
window_rule=is_fullscreen:1,focused_opacity:1.0,unfocused_opacity:1.0,app_id:^screensaver$

# layer rules: of the shell's layers only the bar is translucent and blurred; the others are opaque or cover the
# whole screen (the popup catcher, the wallpaper picker, the dock's layer), where a blur would cost a full-screen pass for nothing
# The dock itself (swiss-dock-body) has the bar's 68 % ground but no blur, the owner's choice (16 October 2026): blur
# here shows the blurred wallpaper (black under the dock), never the window under it, so the dock read as solid; without
# it, a window under the dock shows through as the wallpaper shows through the bar
layer_rule=no_blur:1,layer_name:^swiss-background$
layer_rule=no_blur:1,layer_name:^swiss-popup$
layer_rule=no_blur:1,layer_name:^swiss-wallpaper$
layer_rule=no_blur:1,layer_name:^swiss-toasts$
layer_rule=no_blur:1,layer_name:^swiss-osd$
layer_rule=no_blur:1,layer_name:^swiss-polkit$
layer_rule=no_blur:1,layer_name:^swiss-dock$
layer_rule=no_blur:1,layer_name:^swiss-dock-body$

# window rule: no screensaver, lock or screen-off while a Proton game has the focus (Proton names its window
# steam_app_<id>): a controller, a cutscene or a benchmark gives no keyboard or mouse input, and hypridle would cover the
# game after 4 minutes. Only while focused, so a game left in the background does not keep the screen awake (gaming audit)
window_rule=idle_inhibit_when_focus:1,app_id:^steam_app_
