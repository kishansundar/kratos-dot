# Blur: on, behind translucent windows and the bar only (the shell's other layers opt out in rule.conf).
# blur_optimized blurs the wallpaper once and reuses it, so the GTX 1070 does not re-blur every frame.
# Neutral parameters: the frosted area keeps the wallpaper's own brightness and colour.
blur=1
blur_layer=1
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 6
blur_params_noise = 0.01
blur_params_brightness = 1.0
blur_params_contrast = 1.0
blur_params_saturation = 1.0

# Shadows: off, under windows and under the shell's panels
shadows = 0
layer_shadows = 0

border_radius=0
no_radius_when_single=0
# Windows: the focused one solid; the others 82 % opaque, frosted by the blur (more see-through, as asked: 94 % until
# 15 October, then 88 %; the browsers and kitty stay solid, rule.conf). Focus is still shown by the border, not by
# transparency alone.
focused_opacity=1.0
unfocused_opacity=0.82

# Animation Configuration: short fades and moves with no overshoot; the shell's panels (layers) appear at once.
animations=1
layer_animations=0
animation_type_open=fade
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
fade_in_begin_opacity=0.8
fade_out_begin_opacity=0.8
animation_duration_move=150
animation_duration_open=120
animation_duration_tag=150
animation_duration_close=120
animation_duration_focus=120
animation_curve_open=0.2,0,0,1
animation_curve_move=0.2,0,0,1
animation_curve_tag=0.2,0,0,1
animation_curve_close=0.2,0,0,1
animation_curve_focus=0.2,0,0,1
animation_curve_opacity_fade_out=0.2,0,0,1
animation_curve_opacity_fade_in=0.2,0,0,1

# Scroller Layout Setting
# The strip's ends 8 px from the screen edge (the gap everywhere else), so the first and last window stand on the
# bar ruler's 00:00 and 24:00 like the other layouts (the owner's choice, 20 October 2026; was 20).
scroller_structs=8
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=1
edge_scroller_pointer_focus=1
# A lone window fills the screen, as on the dwindle tags: mango uses scroller_default_proportion_single only when
# this is 0 (at 1 a lone window stayed at 80 %, centred).
scroller_ignore_proportion_single=0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
smart_gaps=0
default_master_factor=0.55
default_master_count=1

#Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
dwindle_preserve_split=1

# Overview Setting
hotarea_size=10
# No hot corner: entering the bottom-left 10 px (mango's default corner) could toggle the overview by accident; the
# overview stays on Super+Tab and Alt+Tab.
enable_hotarea=0
overview_gap_inner=5
overview_gap_outer=30

# Misc
xwayland_persistence=0
sync_obj_enable=1
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=0
focus_cross_tag=0
tag_num=9
# Super+N (and a click on the bar's layout plan) steps through all 14 layouts: dwindle and monocle first, as before,
# then the master-stack family, the scrollers, grids, decks and fair.
circle_layout=dwindle,monocle,tile,right_tile,center_tile,vertical_tile,scroller,vertical_scroller,grid,vertical_grid,deck,vertical_deck,fair,vertical_fair
enable_floating_snap=1
snap_distance=50
cursor_size=24
cursor_theme=Bibata-Modern-Ice
cursor_hide_timeout=0
drag_tile_to_tile=1
single_scratchpad = 1

# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us

# Mouse (no touchpad on this PC, so no trackpad or gesture settings)
mouse_natural_scrolling=0
mouse_accel_profile=2
mouse_accel_speed=0.0

# Appearance
# Gaps: 8 px everywhere (screen edges, under the bar, between windows), the bar's padding too (Theme.bar.padX), so
# window edges run on the ruler's 00:00 and 24:00 ticks and the frame has one measure (16 px until 15 October evening;
# the owner found it too much and chose one 8 px measure). The bar reserves its 32 px itself (exclusive zone); the gap
# is added below it, once. smart_gaps stays off, so a single window keeps the same frame.
gap_inner_horizontal=8
gap_inner_vertical=8
gap_outer_horizontal=8
gap_outer_vertical=8
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
# A 1 px hairline, like every rule in the shell; focus is shown by its ink (colors.conf).
border_px=1
# Mouse resize grabs only the outer 3 px of a window (the 1 px border and 2 px in): the default 10 px took clicks meant
# for the window's own edge (a terminal's last column, a scrollbar). Super+right-drag still resizes from anywhere.
border_resize_size=3
# Colours: all in colors.conf, which links to the Light or Dark Mode file (~/.config/swiss-desktop; Super+Shift+T switches).

# sub config load
source=./bind.conf
source=./rule.conf
source=./tag.conf
source=./colors.conf
source=./monitors.conf

# run autostart
exec_once=~/.config/mango/autostart.sh

