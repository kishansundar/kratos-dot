# reload config
bind=SUPER,r,reload_config
# reload the bar: Quickshell reads its files again (for a save it did not notice); Super+R above reloads mango
bind=SUPER+SHIFT,r,spawn,qs ipc call bar reload

# menu and terminal
bind=SUPER,Return,spawn,/home/kishan/.config/quickshell/scripts/busy-launch kitty kitty
bind=SUPER,space,spawn,qs ipc call bar launcher
# clipboard history: Super+V opens the bar's list of what was copied; typing narrows it, Enter copies the chosen entry again, Delete forgets it
bind=SUPER,v,spawn,qs ipc call bar clipboard

# power menu: Super+Esc opens the session menu under the power mark at the right end of the bar (lock, log out, restart, power off); arrows and Enter choose, Esc closes
bind=SUPER,Escape,spawn,qs ipc call bar power
# dashboard: Super+D opens the dashboard (also a right click on the NixOS mark at the left end of the bar; a left click there opens the launcher)
bind=SUPER,d,spawn,qs ipc call bar dashboard
# wallpaper: Super+W opens the picker (the pictures in ~/Pictures/Wallpapers as a row of cards); Enter sets one for the current mode
bind=SUPER,w,spawn,qs ipc call bar wallpaper
# close window: Super+Q (bindr: acts once, when the key is let go, so holding it never closes a second window)
bindr=SUPER,q,killclient,

# switch window focus
bind=SUPER,Tab,overcircle,next
bind=ALT,Tab,togglejump
bind=SUPER+shift,n,focusstack,next
bind=SUPER,u,focuslast
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# swap window
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right

# movewin
bind=SUPER+CTRL+SHIFT,Up,movewin,+0,-50
bind=SUPER+CTRL+SHIFT,Down,movewin,+0,+50
bind=SUPER+CTRL+SHIFT,Left,movewin,-50,+0
bind=SUPER+CTRL+SHIFT,Right,movewin,+50,+0


# resizewin
bind=CTRL+ALT,Up,resizewin,+0,-50
bind=CTRL+ALT,Down,resizewin,+0,+50
bind=CTRL+ALT,Left,resizewin,-50,+0
bind=CTRL+ALT,Right,resizewin,+50,+0

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,backslash,togglefloating,
bind=SUPER,a,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER,o,toggleoverlay,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER,z,toggle_scratchpad

# scroller layout
bind=SUPER+SHIFT,x,set_proportion,1.0
bind=SUPER,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout
bind=alt+shift,Return,dwindle_toggle_current_split

# tile layout
bind=SUPER,e,incnmaster,1
bind=SUPER,t,incnmaster,-1
bind=SUPER,s,zoom,

# switch layout
bind=CTRL+SUPER,i,setlayout,tile
bind=CTRL+SUPER,l,setlayout,scroller
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind=ctrl+Super,1,toggletag,1
bind=ctrl+Super,2,toggletag,2
bind=ctrl+Super,3,toggletag,3
bind=ctrl+Super,4,toggletag,4
bind=ctrl+Super,5,toggletag,5
bind=ctrl+Super,6,toggletag,6
bind=ctrl+Super,7,toggletag,7
bind=ctrl+Super,8,toggletag,8
bind=ctrl+Super,9,toggletag,9

bind=SUPER+ALT,1,toggleview,1
bind=SUPER+ALT,2,toggleview,2
bind=SUPER+ALT,3,toggleview,3
bind=SUPER+ALT,4,toggleview,4
bind=SUPER+ALT,5,toggleview,5
bind=SUPER+ALT,6,toggleview,6
bind=SUPER+ALT,7,toggleview,7
bind=SUPER+ALT,8,toggleview,8
bind=SUPER+ALT,9,toggleview,9

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,Up,focusmon,up
bind=alt+shift,Down,focusmon,down
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,Up,tagmon,up
bind=SUPER+Alt,Down,tagmon,down

# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps


# Mouse Button Bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
# (no Alt+wheel bind: focus follows the mouse anyway, and the bind kept Alt+wheel from every app)
axisbind=shift+super,UP,exchange_client,left
axisbind=shift+super,DOWN,exchange_client,right



# volume, brightness and media keys (l: also on the lock screen; s: matched by key name). Brightness is the monitor's own
# backlight over DDC/CI, through the shell (services/Brightness, the one writer to the I2C bus; it shows the OSD):
# brightnessctl had no backlight device to set on this desktop.
bindl=none,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=none,XF86MonBrightnessUp,spawn,qs ipc call bar brightnessUp
bindl=none,XF86MonBrightnessDown,spawn,qs ipc call bar brightnessDown
# media keys: the player the bar shows (the shell's Media.player), not playerctl's own pick
bindl=none,XF86AudioNext,spawn,qs ipc call bar next
bindsl=none,XF86AudioPause,spawn,qs ipc call bar playPause
bindsl=none,XF86AudioPlay,spawn,qs ipc call bar playPause
bindl=none,XF86AudioPrev,spawn,qs ipc call bar previous

#custom app bind (busy-launch: the bar shows "starting" until the window opens; the owner's busy-indicator package)
bind=SUPER,b,spawn,/home/kishan/.config/quickshell/scripts/busy-launch zen zen
bind=SUPER+SHIFT,b,spawn,/home/kishan/.config/quickshell/scripts/busy-launch helium helium
bind=SUPER+SHIFT,e,spawn,/home/kishan/.config/quickshell/scripts/busy-launch kitty kitty yazi
# screenshots (the shell's scripts/screenshot.sh): clipboard + ~/Pictures/Screenshots + a notification;
# region snaps to a window on a click, a drag draws a box
bind=SUPER+SHIFT,s,spawn,/home/kishan/.config/quickshell/scripts/screenshot.sh region
bind=none,Print,spawn,/home/kishan/.config/quickshell/scripts/screenshot.sh screen
bind=SHIFT,Print,spawn,/home/kishan/.config/quickshell/scripts/screenshot.sh window
# lock: Super+Shift+L (bindl: also on the lock screen, so a lock screen that died can be brought back with the same key)
bindl=SUPER+SHIFT,l,spawn,loginctl lock-session
# light and dark mode: Super+Shift+T switches the whole desktop (~/.config/swiss-desktop/bin/swiss-mode)
bindr=SUPER+SHIFT,t,spawn_shell,~/.config/swiss-desktop/bin/swiss-mode toggle
# night light: warm screen (4000 K) on or off (also the Night light tile on the dashboard)
bind=SUPER+ALT,n,spawn,qs ipc call bar night
# keep awake: Super+Alt+C stops the screen locking or switching off until pressed again (also the cup in the bar and the dashboard's Caffeine switch)
bind=SUPER+ALT,c,spawn,qs ipc call bar caffeine
bind=CTRL+ALT,backslash,spawn,qs ipc call bar notifications
bind=CTRL+ALT,BackSpace,spawn,qs ipc call bar clear
# popups under their bar glyph: calendar (Super+Ctrl+C), audio (Super+Ctrl+A), Wi-Fi (Super+Ctrl+W),
# Bluetooth (Super+Ctrl+B), Claude Code (Super+Ctrl+K), now playing (Super+Ctrl+M); Esc closes. Super+Ctrl+T opens or
# closes the tray drawer in the bar.
bind=CTRL+SUPER,c,spawn,qs ipc call bar calendar
bind=CTRL+SUPER,a,spawn,qs ipc call bar audio
bind=CTRL+SUPER,w,spawn,qs ipc call bar network
bind=CTRL+SUPER,b,spawn,qs ipc call bar bluetooth
bind=CTRL+SUPER,k,spawn,qs ipc call bar claude
bind=CTRL+SUPER,m,spawn,qs ipc call bar media
bind=CTRL+SUPER,t,spawn,qs ipc call bar tray
