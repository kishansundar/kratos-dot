# monitors: one line per screen, written by hand: size, refresh rate (165: the PG279Q's top mode, its OSD overclock; 1000 would ask for the highest), scale, rotation (rr), VRR (vrr: not set, so off on the desktop; rule.conf turns it on only while a full-screen window has the focus) and place (x, y)
# The PG279Q on DP-2, by name: a second screen gets mango's defaults (its preferred mode, placed beside this one) instead
# of this rule's 2560x1440 at 0,0 on top of it (audit NIX-10). If the PG279Q moves to another port, change the name here.
monitor_rule=name:^DP-2$,width:2560,height:1440,refresh:165,x:0,y:0
